name: Sync Code to GitLab

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitlab-code-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      GITLAB_REPO_URL: ${{ secrets.GITLAB_REPO_URL_SPECTEMPLATE }}

    steps:
      - name: Skip when GitLab is not configured
        if: env.GITLAB_TOKEN == '' || env.GITLAB_REPO_URL == ''
        run: |
          echo "::notice::GitLab mirror not configured (GITLAB_TOKEN / GITLAB_REPO_URL_SPECTEMPLATE absent); skipping the mirror. The documents and the consistency job are unaffected."

      - name: Checkout complete repository
        if: env.GITLAB_TOKEN != '' && env.GITLAB_REPO_URL != ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Configure Git
        if: env.GITLAB_TOKEN != '' && env.GITLAB_REPO_URL != ''
        run: |
          git config user.name "GitHub-GitLab Sync Bot"
          git config user.email "github-gitlab-sync-bot@users.noreply.github.com"

      - name: Mirror to GitLab
        if: env.GITLAB_TOKEN != '' && env.GITLAB_REPO_URL != ''
        run: |
          set -eu
          target="$GITLAB_REPO_URL"
          target="${target#https://}"
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@${target}"
          git push --mirror gitlab
