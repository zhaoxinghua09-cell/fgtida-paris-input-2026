name: Sync Code to GitLab
on:
  push:
    branches:
      - "**"
    tags:
      - "**"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitlab-code-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout complete repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Configure Git
        run: |
          git config user.name "GitHub-GitLab Sync Bot"
          git config user.email "github-gitlab-sync-bot@users.noreply.github.com"

      # The mirror is optional infrastructure. When the two secrets below are absent,
      # say so plainly and skip the mirror instead of failing a push that has nothing
      # to do with GitLab. Set GITLAB_TOKEN and GITLAB_REPO_URL_SPECTEMPLATE to enable.
      - name: Check GitLab configuration
        id: cfg
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_REPO_URL: ${{ secrets.GITLAB_REPO_URL_SPECTEMPLATE }}
        run: |
          if [ -n "$GITLAB_TOKEN" ] && [ -n "$GITLAB_REPO_URL" ]; then
            echo "present=yes" >> "$GITHUB_OUTPUT"
            echo "GitLab mirror: configured, mirroring."
          else
            echo "present=no" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitLab mirror skipped::GITLAB_TOKEN and/or GITLAB_REPO_URL_SPECTEMPLATE are not set, so nothing is mirrored. This is not a failure of the contribution."
          fi

      - name: Add GitLab remote
        if: steps.cfg.outputs.present == 'yes'
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_REPO_URL: ${{ secrets.GITLAB_REPO_URL_SPECTEMPLATE }}
        run: |
          GITLAB_HOST="${GITLAB_REPO_URL#https://}"
          git remote add gitlab \
            "https://oauth2:${GITLAB_TOKEN}@${GITLAB_HOST}"
          echo "GitLab remote configured."

      - name: Synchronize branches
        if: steps.cfg.outputs.present == 'yes'
        run: git push gitlab "refs/heads/*:refs/heads/*"

      - name: Synchronize tags
        if: steps.cfg.outputs.present == 'yes'
        run: git push gitlab "refs/tags/*:refs/tags/*"
